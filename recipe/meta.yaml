{% set name = "fsspec" %}
{% set version = "2026.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/filesystem_spec/archive/refs/tags/{{ version }}.tar.gz
  sha256: c876aee137711240d4f821a5d8811ed19bde9df504d941cac22a116075de1ebc

build:
  number: 0
  script: {{ PYTHON }}  -m pip install . --no-deps --ignore-installed --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling >=1.27.0
    - hatch-vcs
  run:
    - python
  run_constrained:
    # arrow
    - pyarrow >=1
    # http
    - aiohttp !=4.0.0a0,!=4.0.0a1
    # gcs
    - gcsfs >=2026.4.0
    # s3
    - s3fs >=2026.6.0

test:
  source_files:
    - fsspec
  imports:
    - fsspec
    - fsspec.implementations
    - fsspec.archive
    - fsspec.asyn
    - fsspec.caching
    - fsspec.callbacks
    - fsspec.compression
    - fsspec.config
    - fsspec.core
    - fsspec.exceptions
    - fsspec.registry
    - fsspec.spec
    - fsspec.transaction
    - fsspec.utils
    - fsspec.parquet
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv fsspec/tests
  requires:
    - pip
    - pytest
    - pytest-mock
    - pytest-asyncio !=0.22.0
    - aiohttp !=4.0.0a0,!=4.0.0a1
    - requests
    - numpy
    # tests rely on linux bash stat behavior, add package on OSX for behavior matching that of linux
    - coreutils  # [osx]
  # Check for dependent downstream packages
  downstreams:
    - snowflake-ml-python
    - datasets
    - s3fs
    - ocifs

about:
  home: https://github.com/fsspec/filesystem_spec
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: A specification for pythonic filesystems
  description: |
    To produce a template or specification for a file-system interface, that specific implementations should follow,
    so that applications making use of them can rely on a common behaviour and not have to worry about the specific
    internal implementation decisions with any given backend.
  dev_url: https://github.com/fsspec/filesystem_spec
  doc_url: https://filesystem-spec.readthedocs.io

extra:
  recipe-maintainers:
    - martindurant
    - TomAugspurger